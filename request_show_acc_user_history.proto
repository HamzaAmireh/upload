
package rti;

message RequestShowAccUserHistory
	{                                
	required int32    template_id   = 154467;
	repeated string   user_msg      = 132760;

	optional string   fcm_id        = 154013;
	optional string   ib_id         = 154014;
	optional string   account_id    = 154008;	// fcm, ib & account required for account history

	optional string   user_target   = 154220;	// required for user history
	
	optional int32    start_index   = 153002;	// seconds since beginning of epoch
	optional int32    finish_index  = 153003;	// seconds since beginning of epoch
	}
