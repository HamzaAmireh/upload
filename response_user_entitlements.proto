
package rti;

message ResponseUserEntitlements
	{       
	required int32    template_id           = 154467;
	repeated string   user_msg              = 132760;
	repeated string   rq_handler_rp_code    = 132764;
	repeated string   rp_code               = 132766;

	optional string   exchange              = 110101;
	optional string   level_1_market_data   = 153508;               // level_1 (top of book) entitlement status
	optional string   level_2_market_data   = 153509;               // level_2 (order book) entitlement status

	optional string   source_user_id        = 154247;
	optional string   user                  = 131003;
	optional string   fcm_id                = 154013;
	optional string   ib_id                 = 154014;

	optional string   app_entitlement       = 153195;		// all or none
	optional string   app_name              = 130002;
	
	optional int32    ssboe                 = 150100;
	optional int32    usecs                 = 150101;
	}
