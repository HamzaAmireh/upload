
package rti;

message BestBidOffer
	{                                     
	// below enum is just for reference only, not used in this message
	enum PresenceBits {
	                  BID          =  1;
	                  ASK          =  2;
			  LEAN_PRICE   =  4;
                          }

	required int32  template_id           = 154467;
	optional string symbol                = 110100;
	optional string exchange              = 110101;

	optional uint32 presence_bits         = 149138;
	optional uint32 clear_bits            = 154571;
	optional bool   is_snapshot           = 110121;

	optional double bid_price             = 100022;
	optional int32  bid_size              = 100030;		// deprecated, use bid_size_64 instead
	optional uint64 bid_size_64           = 159000;
	optional int32  bid_orders            = 154403;
	optional int32  bid_implicit_size     = 154867;		// deprecated, use bid_implicit_size_64 instead
	optional uint64 bid_implicit_size_64  = 159001;
	optional string bid_time              = 100266;

	optional double ask_price             = 100025;
	optional int32  ask_size              = 100031;		// deprecated, use ask_size_64 instead
	optional uint64 ask_size_64           = 159002;
	optional int32  ask_orders            = 154404;
	optional int32  ask_implicit_size     = 154868;		// deprecated, use ask_implicit_size instead
	optional uint64 ask_implicit_size_64  = 159003;
	optional string ask_time              = 100267;

	optional double lean_price            = 154909;

	optional int32  ssboe                 = 150100;
	optional int32  usecs                 = 150101;
	}